name: build-parcels-index

# Regenerates <slug>/web/data/parcels_index.json — the village -> parcel bbox
# lookup that lets the map jump precisely to a village's land parcels. The scan
# reads the whole-state cadastral PMTiles (~850 MB, thousands of tiles), so it
# runs here rather than on a laptop. Publishes the refreshed index to the
# data/parcels-index branch (regenerable artifacts live outside main's reviewed
# history; deploy-pages/release overlay them). The branch is shared by all
# states — publish-data-branch updates it non-destructively per slug.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: State slug
        default: andhra_pradesh
        required: true
      pmtiles_url:
        description: Cadastral PMTiles URL to scan
        default: https://github.com/ramSeraph/indian_cadastrals/releases/download/andhra-pradesh/APSAC_AP_Cadastrals.pmtiles
        required: true
      source_layer:
        description: Vector layer id inside the PMTiles
        default: APSAC_AP_Cadastrals
        required: true

permissions:
  contents: write # push the data/parcels-index branch

concurrency:
  group: build-parcels-index-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Bind dispatch inputs to env and reference them as shell vars, never
      # interpolate ${{ inputs.* }} directly into a run: script (that substitutes
      # textually before the shell parses it — a value with `$(...)`/`;` would run).
      SLUG: ${{ inputs.slug }}
      PMTILES_URL: ${{ inputs.pmtiles_url }}
      SOURCE_LAYER: ${{ inputs.source_layer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          packages: pmtiles mapbox-vector-tile shapely

      - name: Download cadastral PMTiles
        run: |
          mkdir -p scraper/.cache/cadastrals
          curl -fSL --retry 3 -o scraper/.cache/cadastrals/cad.pmtiles "$PMTILES_URL"
          head -c 7 scraper/.cache/cadastrals/cad.pmtiles | grep -q PMTiles \
            || { echo "::error::Not a PMTiles archive"; exit 1; }

      - name: Build parcels index
        run: |
          python scraper/build_parcels_index.py \
            --slug "$SLUG" \
            --pmtiles scraper/.cache/cadastrals/cad.pmtiles \
            --source-layer "$SOURCE_LAYER"

      - name: Publish to the data/parcels-index branch
        uses: ./.github/actions/publish-data-branch
        with:
          branch: data/parcels-index
          files: ${{ inputs.slug }}/web/data/parcels_index.json ${{ inputs.slug }}/web/data/village_points.json
          message: "data: parcels index + village points for ${{ inputs.slug }}"
          summary: "📇 Published ${{ inputs.slug }} parcels index + village points to data/parcels-index."
          token: ${{ github.token }}
