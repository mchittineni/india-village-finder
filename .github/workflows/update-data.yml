name: Update Village Data

on:
  schedule:
    - cron: "0 2 * * 0" # weekly  — Sundays 02:00 UTC: refresh village data (data.gov.in)
    - cron: "0 3 1 * *" # monthly — 1st 03:00 UTC: data + boundaries
  workflow_dispatch:
    inputs:
      refresh_boundaries:
        description: "Also rebuild map boundary polygons"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: update-village-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        state:
          - { key: ap, slug: andhra_pradesh }
          - { key: tg, slug: telangana }
          - { key: ka, slug: karnataka }
          - { key: tn, slug: tamil_nadu }
          - { key: kl, slug: kerala }

    env:
      STATE_KEY: ${{ matrix.state.key }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Overlay OSM name seeds
        uses: ./.github/actions/overlay-data-branches
        with:
          branches: data/osm-names

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          node-version: "22"
          requirements-file: scraper/requirements-dev.txt

      - name: Harvest verified transliteration review notes
        run: python scraper/translit_review.py harvest || true

      - name: Refresh village data
        id: refresh
        uses: ./.github/actions/datagov-fetch
        env:
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
        with:
          command: python scraper/pipeline.py --state "$STATE_KEY"
          skip-summary: "⏭️ ${{ matrix.state.slug }}: data.gov.in unreachable after retries; skipped."

      - name: Decide whether to refresh boundaries
        id: bounds
        env:
          CRON: ${{ github.event.schedule }}
          WANT_BOUNDS: ${{ github.event.inputs.refresh_boundaries }}
        run: |
          if [ "$CRON" = "0 3 1 * *" ] || [ "$WANT_BOUNDS" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh map boundaries (monthly / on request)
        if: steps.bounds.outputs.run == 'true' && steps.refresh.outputs.skipped != 'true'
        run: python scraper/build_boundaries.py --state "$STATE_KEY"

      - name: Refresh village coordinates (needs boundaries)
        if: steps.bounds.outputs.run == 'true' && steps.refresh.outputs.skipped != 'true'
        run: python scraper/enrich_coords.py --state "$STATE_KEY"

      - name: Upload state artifact
        if: steps.refresh.outputs.skipped != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: data-${{ matrix.state.slug }}
          path: ${{ matrix.state.slug }}
          retention-days: 3

  aggregate:
    needs: build
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has-changes: ${{ steps.changed.outputs.yes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          requirements-file: scraper/requirements-dev.txt

      - name: Download state artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: data-*
          path: _incoming

      - name: Overlay artifacts onto the working tree
        id: overlay
        run: |
          count=0
          shopt -s nullglob
          for d in _incoming/data-*; do
            slug=$(basename "$d"); slug=${slug#data-}
            rsync -a "$d"/ "$slug"/
            count=$((count + 1))
            echo "overlaid $slug"
          done
          rm -rf _incoming
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            echo "No state artifacts (all legs skipped/failed) — nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate new data (pytest)
        id: tests
        if: steps.overlay.outputs.count != '0'
        continue-on-error: true
        run: |
          python -m pytest scraper/tests -v | tee /tmp/pytest.txt
          echo "outcome=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Detect real data changes
        id: changed
        if: steps.overlay.outputs.count != '0'
        run: |
          DATA_FILES="
            */web/data/regions.json
            */web/data/villages.json
            */web/data/names.json
            */web/data/districts.geojson
            */web/data/mandals.geojson
            */web/data/coords.json
            */data/*_villages.csv
          "
          if [ -n "$(git status --porcelain -- $DATA_FILES)" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            git checkout -- . || true   # discard timestamp-only churn → no empty PR
            echo "No real data changes — skipping PR." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build PR summary
        if: steps.changed.outputs.yes == 'true'
        env:
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python scraper/changelog.py --out /tmp/pr_body.md
          {
            echo ""
            echo "### ✅ Validation"
            if [ "$TESTS_OUTCOME" = "success" ]; then
              echo "All data-validity tests **passed**.";
            else
              echo "⚠️ Data-validity tests **failed** — do not merge until fixed.";
              echo '```'; tail -n 25 /tmp/pytest.txt; echo '```'
            fi
            echo ""
            echo "<sub>🤖 Auto-maintained: while this PR is open, later refresh runs update it in place (this description reflects the latest run).</sub>"
          } >> /tmp/pr_body.md
          cat /tmp/pr_body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create / update pull request
        id: cpr
        if: steps.changed.outputs.yes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data/auto-refresh
          delete-branch: true
          add-paths: |
            */web/data/**
            */data/**
            scraper/translit_overrides*.json
            notes/translit-review/**
          commit-message: "chore(data): refresh LGD village data"
          title: "chore(data): LGD village data refresh"
          body-path: /tmp/pr_body.md
          labels: |
            data-update
            automated
          reviewers: mchittineni

      - name: Report validation status check on the PR
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          HEAD_SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          STATE=$([ "$TESTS_OUTCOME" = "success" ] && echo success || echo failure)
          gh api -X POST "repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f context="data-validation" \
            -f description="Automated data-validity tests" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Request Copilot review (best-effort)
        if: steps.cpr.outputs.pull-request-number
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer[bot]"

      - name: Summary
        if: steps.changed.outputs.yes == 'true'
        run: |
          echo "PR ${{ steps.cpr.outputs.pull-request-url || 'opened (see PRs)' }}"

  regenerate-names:
    needs: aggregate
    if: needs.aggregate.outputs.has-changes == 'true'
    uses: ./.github/workflows/regenerate-native-names.yml
    with:
      branch: data/auto-refresh

  mandi-prices:
    name: mandi-prices
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          packages: requests

      - name: Fetch mandi prices
        id: fetch
        uses: ./.github/actions/datagov-fetch
        env:
          DATA_GOV_KEY: ${{ secrets.DATA_GOV_KEY }}
        with:
          command: python scraper/fetch_mandi_prices.py --out /tmp/mandi
          skip-summary: "⏭️ data.gov.in unreachable; mandi snapshot not refreshed."

      - name: Publish to data/mandi-prices branch
        if: steps.fetch.outputs.skipped != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          auth="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 --branch data/mandi-prices "$auth" "$work" 2>/dev/null \
            || git init -q -b data/mandi-prices "$work"
          cp /tmp/mandi/*.json "$work"/
          cd "$work"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then
            echo "No mandi price changes today."
            echo "🧺 Mandi prices unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: mandi prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q "$auth" data/mandi-prices
          echo "🧺 Published $(ls *.json | wc -l) state snapshots to data/mandi-prices." >> "$GITHUB_STEP_SUMMARY"

  farmer-schemes:
    name: farmer-schemes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          packages: requests

      - name: Fetch farmer schemes
        id: fetch
        uses: ./.github/actions/datagov-fetch
        env:
          MYSCHEME_API_KEY: ${{ secrets.MYSCHEME_API_KEY }}
        with:
          command: python scraper/fetch_farmer_schemes.py --out /tmp/schemes
          skip-summary: "⏭️ myScheme unreachable; farmer-schemes snapshot not refreshed."

      - name: Publish to data/farmer-schemes branch
        if: steps.fetch.outputs.skipped != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          auth="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 --branch data/farmer-schemes "$auth" "$work" 2>/dev/null \
            || git init -q -b data/farmer-schemes "$work"
          cp /tmp/schemes/*.json "$work"/
          cd "$work"
          git add -A
          if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then
            echo "No farmer scheme changes this week."
            echo "🌾 Farmer schemes unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: farmer schemes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q "$auth" data/farmer-schemes
          echo "🌾 Published $(ls *.json | wc -l) state scheme snapshots to data/farmer-schemes." >> "$GITHUB_STEP_SUMMARY"
