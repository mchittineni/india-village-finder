name: Validate Data

on:
  pull_request:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-validation:
    name: data-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          node-version: "22"
          requirements-file: scraper/requirements-dev.txt

      - name: Validate data (pytest)
        run: python -m pytest scraper/tests -v

      - name: Transliteration accuracy (regression guard)
        run: node scraper/translit_eval.mjs --check
