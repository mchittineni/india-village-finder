name: data-validation

on:
  pull_request:
  push:
    branches: [main]

  workflow_dispatch:

# Least-privilege default token: this workflow runs untrusted fork-PR code
# (pytest + node eval on the PR checkout) and only needs to read the repo.
permissions:
  contents: read

jobs:
  data-validation:
    name: data-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          requirements-file: scraper/requirements-dev.txt

      - name: Validate data (pytest)
        run: python -m pytest scraper/tests -v

      - name: Transliteration accuracy (regression guard)
        run: node scraper/translit_eval.mjs --check
