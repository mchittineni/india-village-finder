name: Publish Blog Post

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to post (e.g. v1.3.0)"
        required: true
      publish:
        description: "Publish immediately (default: create drafts)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          packages: requests

      - name: Fetch release notes (fallback body)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: gh release view "$TAG" --json body --jq .body > /tmp/notes.md

      - name: Build and cross-post
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          FLAGS="--devto --medium"
          if [ "$PUBLISH" = "true" ]; then FLAGS="$FLAGS --publish"; fi
          python scraper/blog_post.py --tag "$TAG" --notes-file /tmp/notes.md \
            --out /tmp/blog_post.md $FLAGS | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "ℹ️ dev.to posts are created as drafts unless dispatched with publish=true."
            echo "For Medium without a legacy API token: use *Import a story* with the dev.to URL."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach post Markdown
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blog-post-${{ github.event.release.tag_name || github.event.inputs.tag }}
          path: /tmp/blog_post.md
          retention-days: 30
