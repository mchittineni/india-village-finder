name: Update OSM Native Names

# Harvests human-verified native place names (name:te / name:kn / name:ta) from
# OpenStreetMap via Overpass and publishes scraper/osm_names.json to the
# data/osm-names branch, which pipeline runs overlay at build time (the pipeline
# prefers these over the neural transliterator). Overpass is public +
# rate-limited, so this runs on demand / monthly here rather than on a laptop.
# The next data refresh applies the names to each state's names.json + CSV.

on:
  schedule:
    - cron: "0 5 1 * *" # monthly — 1st, 05:00 UTC
  workflow_dispatch:
    inputs:
      state:
        description: "State(s) to harvest: all | ap | tg | ka | tn"
        default: all

permissions:
  contents: write # push the data/osm-names branch

concurrency:
  group: seed-osm-names
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest

    env:
      OSM_STATE: ${{ inputs.state || 'all' }}
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          packages: requests

      - name: Harvest native names from OpenStreetMap
        run: python scraper/seed_osm_names.py --state "$OSM_STATE"

      - name: Publish to the data/osm-names branch
        uses: ./.github/actions/publish-data-branch
        with:
          branch: data/osm-names
          files: scraper/osm_names.json
          message: "data: OSM-sourced native place names"
          summary: "🌐 Published OSM native names to data/osm-names."
          token: ${{ github.token }}
