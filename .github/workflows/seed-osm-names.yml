name: Update OSM Native Names

on:
  workflow_run:
    workflows: ["Update Village Data"]
    types: [completed]
  schedule:
    - cron: "0 5 1 * *" # monthly — 1st, 05:00 UTC
  workflow_dispatch:
    inputs:
      state:
        description: "State(s) to harvest"
        type: choice
        options: [all, ap, tg, ka, tn, kl]
        default: all

permissions:
  contents: write

concurrency:
  group: seed-osm-names
  cancel-in-progress: false

jobs:
  seed:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      OSM_STATE: ${{ inputs.state || 'all' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          packages: requests

      - name: Harvest native names from OpenStreetMap
        run: python scraper/seed_osm_names.py --state "$OSM_STATE"

      - name: Publish to the data/osm-names branch
        uses: ./.github/actions/publish-data-branch
        with:
          branch: data/osm-names
          files: scraper/osm_names.json
          message: "data: OSM-sourced native place names"
          summary: "🌐 Published OSM native names to data/osm-names."
          token: ${{ github.token }}
