name: Update Farmer Schemes

on:
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-farmer-schemes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup environment
        uses: ./.github/actions/setup-pipeline
        with:
          packages: requests

      - name: Fetch farmer schemes
        id: fetch
        uses: ./.github/actions/datagov-fetch
        env:
          MYSCHEME_API_KEY: ${{ secrets.MYSCHEME_API_KEY }}
        with:
          command: python scraper/fetch_farmer_schemes.py --out /tmp/schemes
          skip-summary: "⏭️ myScheme unreachable; farmer-schemes snapshot not refreshed."

      - name: Publish to the data/farmer-schemes branch
        if: steps.fetch.outputs.skipped != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          work="$(mktemp -d)"
          cp /tmp/schemes/*.json "$work"/
          cd "$work"
          git init -q -b data/farmer-schemes
          git add .
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "data: farmer schemes $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            data/farmer-schemes
          echo "🌾 Published $(ls *.json | wc -l) state scheme snapshots to data/farmer-schemes." >> "$GITHUB_STEP_SUMMARY"
